tags:
  - Task Status

description:
  Get all task statuses. Requires an active session cookie

security:
  - cookieAuth: []

responses:
  200:
    description: Task statuses retrieved successfully
    schema:
      type: object
      properties:
        taskStatuses:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 2
              status:
                type: string
                example: To Do

  401:
    description: Unauthorized (missing or invalid session cookie)
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)