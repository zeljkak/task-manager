tags:
  - Notifications

description: >
  List notifications for the current user (newest first).
  Requires an active session cookie.

security:
  - cookieAuth: []

parameters:
  - name: unreadOnly
    in: query
    type: boolean
    required: false
    default: false
  - name: page
    in: query
    type: integer
    required: false
    default: 1
  - name: perPage
    in: query
    type: integer
    required: false
    default: 50

responses:
  200:
    description: Notifications retrieved successfully
    schema:
      type: object
      properties:
        notifications:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              message:
                type: string
                example: "New comment on \"Frontend refresh task\": this is a comment"
              actor:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  firstName:
                    type: string
                    example: Anna
                  lastName:
                    type: string
                    example: Smith
              task:
                type: object
                properties:
                  id:
                    type: integer
                    example: 3
                  title:
                    type: string
                    example: Frontend refresh task
                  assignedTo:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 2
                      firstName:
                        type: string
                        example: Elsa
                      lastName:
                        type: string
                        example: Smith
              title:
                type: string
                example: "New comment"
              isRead:
                type: boolean
                example: false
              createdAt:
                type: string
                format: date-time
                example: "2026-11-10T16:09:51.112728+01:00"
        hasNext:
          type: boolean
          example: false
        unreadCount:
          type: integer
          example: 3
  401:
    description: Unauthorized (missing or invalid session cookie)
  503:
    description: Service unavailable (database service down)
