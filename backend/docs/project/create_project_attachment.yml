tags:
  - Project

description: >
  Create attachments for a specific project that matches the ID. 
  Requires an active session cookie and a valid X-CSRF-TOKEN header.

security:
  - cookieAuth: []

consumes:
  - multipart/form-data

parameters:
  - name: X-CSRF-TOKEN
    in: header
    required: true
    type: string
    description: CSRF token read from the csrf_access_token cookie.
  - name: projectId
    in: path
    required: true
    type: integer
    example: 4
    description: ID of the project to create an attachment for
  - name: file
    in: formData
    required: true
    type: array
    items:
      type: file
    description: One or more files to upload

responses:
  201:
    description: Attachments created successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: Attachments created successfully
        attachments:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              fileUrl:
                type: string
                example: "http://localhost:5000/uploads/abc123_design.pdf"
              fileName:
                type: string
                example: "design.pdf"
              fileType:
                type: string
                example: "application/pdf"
              createdAt:
                type: datetime
                example: "2026-08-28T13:54:55.729333+02:00"
              createdBy:
                type: object
                properties:
                  id:
                    type: integer
                    example: 1
                  firstName:
                    type: string
                    example: Anna
                  lastName:
                    type: string
                    example: Smith
  400:
    description: Bad request (missing or invalid fields)
  401:
    description: Unauthorized (missing or invalid session cookie or CSRF token)
  404:
    description: Related resource not found
  413:
    description: Payload too large - file size exceeds the 10 MB limit.
  500:
    description: Internal server error
  503:
    description: Database unavailable