tags:
  - Project

description: >
  Retrieve basic projects list. 
  Requires an active session cookie

security:
  - cookieAuth: []

responses:
  200:
    description: Projects retrieved successfully
    schema:
      type: object
      properties:
        projects:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 2
              projectName:
                type: string
                example: Second project
              projectDescription:
                type: string
                example: This project can be used as a client dashboard. All tasks relating to the specific client are connected to it.
              archived:
                type: boolean
                example: True

  401:
    description: Unauthorized (missing or invalid session cookie)
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)