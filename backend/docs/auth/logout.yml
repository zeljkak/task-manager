tags:
  - Auth

summary: Log out user and clear session
description: >
  Logs out the current user by revoking active JWT tokens and clearing HTTP-only session cookies.
  
  The endpoint attempts to identify the user via access token or refresh cookie.
  If identified, the refresh token JTI is added to the blocklist and user session versions are invalidated.
  This endpoint always returns 200 OK to ensure client cookies are cleared regardless of session status.

responses:
  200:
    description: Logout successful. Access and refresh cookies are cleared from the client.
    headers:
      Set-Cookie:
        type: string
        description: Set-Cookie headers that expire access_token_cookie and refresh_token_cookie.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Logout successful
  500:
    description: Internal server error