tags:
  - Auth

description: Verify account by email.

parameters:
  - name: token
    in: path
    required: true
    type: string
    description: Verify account token sent via email

responses:
  200:
    description: Email verified successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: Email verified successfully
      examples:
        verified_success:
          summary: Email verified
          value:
            message: Email verified successfully
        already_verified:
          summary: Email already verified
          value:
            message: Email address already verified
  400:
    description: Bad request (invalid or expired token)
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)