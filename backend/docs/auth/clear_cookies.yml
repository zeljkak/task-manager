tags:
  - Auth

description: >
  Clears access and refresh HttpOnly JWT cookies from the client browser without revoking server-side sessions.
  Used during soft logout.

responses:
  200:
    description: Cookies cleared successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: Cookies cleared successfully
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or server error)