tags:
  - Auth

summary: Authenticate user and issue JWT cookies

description: >
  Authenticates user credentials and issues access, refresh and CSRF JWT cookies upon success.
  Validates that the user exists, is not soft-deleted and has a verified email address.

parameters:
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@mail.com
        password:
          type: string
          format: password
          example: 123456Yy.
responses:
  200:
    description: Login successful. Access and refresh JWT cookies are attached to the response.
    headers:
      Set-Cookie:
        type: string
        description: Sets access_token_cookie, refresh_token_cookie, csrf_access_token and csrf_refresh_token.
    schema:
      type: object
      properties:
        message:
          type: string
          example: Login successful
  400:
    description: Bad request (missing or invalid fields)
  401:
    description: Authentication error. Responds with simple string error for credential/account issues, or error + message structure for JWT callbacks.
  422:
    description: Validation error (invalid email format)
  429:
    description: Too many login attempts
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)