tags:
  - Role

description:
  Get a specific role that matches the id. Requires an active session cookie

parameters:
  - name: roleId
    in: path
    required: true
    type: integer
    example: 1
    description: ID of the role to retrieve

responses:
  200:
    description: Role retrieved successfully
    schema:
      type: object
      properties:
        role:
          type: object
          properties:
            id:
              type: integer
              example: 2
            roleName:
              type: string
              example: user

  401:
    description: Unauthorized (missing or invalid session cookie)
  403:
    description: Forbidden (unallowed action)
  404:
    description: Related resource not found
  422:
    description: Validation error
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)