tags:
  - Role

description: >
  Get all roles.
  Requires an active session cookie and an account with the admin role.


security:
  - cookieAuth: []

responses:
  200:
    description: Roles retrieved successfully
    schema:
      type: object
      properties:
        roles:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 2
              roleName:
                type: string
                example: user

  401:
    description: Unauthorized (missing or invalid session cookie)
  403:
    description: Forbidden (unallowed action)
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)