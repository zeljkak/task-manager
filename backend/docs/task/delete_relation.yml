tags:
  - Task

description: >
  Delete a specific relation between tasks. 
  Requires an active session cookie and a valid X-CSRF-TOKEN header.

security:
  - cookieAuth: []

parameters:
  - name: X-CSRF-TOKEN
    in: header
    required: true
    type: string
    description: CSRF token read from the csrf_access_token cookie.
  - name: taskId
    in: path
    required: true
    type: integer
    example: 2
    description: ID of the task in relation
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - relatedTaskId
      properties:
        relatedTaskId:
          type: integer
          example: 3

responses:
  204:
    description: Task relation deleted successfully
  401:
    description: Unauthorized (missing or invalid session cookie or CSRF token)
  404:
    description: Related resource not found
  422:
    description: Validation error
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)