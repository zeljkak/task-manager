tags:
  - Task

description:
  Delete a specific task that matches the id. Requires an active session cookie

security:
  - cookieAuth: []

parameters:
  - name: taskId
    in: path
    required: true
    type: integer
    example: 1
    description: ID of the task to delete

responses:
  204:
    description: Task deleted successfully
  401:
    description: Unauthorized (missing or invalid session cookie)
  403:
    description: Forbidden (unallowed action)
  404:
    description: Related resource not found
  422:
    description: Validation error
  429:
    description: Too many requests
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)