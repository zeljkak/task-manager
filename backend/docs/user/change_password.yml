tags:
  - User

description: >
  Change the password. 
  Requires an active session cookie and a valid X-CSRF-TOKEN header.

security:
  - cookieAuth: []

parameters:
  - name: X-CSRF-TOKEN
    in: header
    required: true
    type: string
    description: CSRF token read from the csrf_access_token cookie.
  - name: body
    in: body
    required: true
    schema:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 8
          example: 123456Ww.
        newPassword:
          type: string
          format: password
          minLength: 8
          example: 123456Ww.
responses:
  200:
    description: Password updated successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: Password updated successfully
  400:
    description: Bad request (missing or invalid session cookie or CSRF token)
  404:
    description: Related resource not found
  422:
    description: Validation error (invalid password)
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)