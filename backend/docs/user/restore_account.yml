tags:
  - User

description: Restore a deleted account.

parameters:
  - name: token
    in: path
    required: true
    type: string
    description: Restore account token sent via email

responses:
  200:
    description: User account restored successfully
    schema:
      type: object
      properties:
        message:
          type: string
          example: User account restored successfully
  400:
    description: Bad request (invalid or expired token)
  500:
    description: Internal server error
  503:
    description: Service unavailable (database or email service down)